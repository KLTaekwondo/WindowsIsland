name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/WindowsIsland/WindowsIsland.csproj

      - name: Build
        run: dotnet build src/WindowsIsland/WindowsIsland.csproj -c Release --no-restore

      - name: Publish (single file)
        run: >
          dotnet publish src/WindowsIsland/WindowsIsland.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsIsland-win-x64
          path: out/WindowsIsland.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/WindowsIsland.exe
